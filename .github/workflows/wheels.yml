# Build the epsr-py wheels and source distribution, and publish them to PyPI on a
# version tag. The extension is built for the stable ABI (abi3-py310), so one wheel
# per platform serves every Python >= 3.10, and users need no Rust toolchain.
#
#   manual run (Actions tab -> wheels -> Run workflow): build and test only
#   push a tag "v0.1.0":                                build, test and publish
#
# Publishing uses PyPI trusted publishing: register this repository and the workflow
# file "wheels.yml" (environment "pypi") as a publisher of epsr-py on pypi.org first.
name: wheels

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  wheels:
    name: wheel ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: linux-x86_64, runner: ubuntu-latest, target: x86_64, manylinux: "2014" }
          - { name: linux-aarch64, runner: ubuntu-24.04-arm, target: aarch64, manylinux: "2014" }
          - { name: macos-x86_64, runner: macos-13, target: x86_64 }
          - { name: macos-arm64, runner: macos-14, target: aarch64 }
          - { name: windows-x86_64, runner: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux || 'auto' }}
          # --strip drops the debug information of the release profile (23 MB -> 3 MB)
          args: --release --strip --out dist
      - name: Install the wheel and import it
        shell: bash
        run: |
          python -m pip install python/dist/*.whl
          cd "$RUNNER_TEMP"
          python -c "import epsr; print('epsr', epsr.__version__, epsr.VERSION_DATE)"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.platform.name }}
          path: python/dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the source distribution
        uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: python/dist

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
