[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "epsr-py"
# The version is that of the Rust crate (Cargo.toml), set by maturin.
dynamic = ["version"]
description = "Python interface to the Rust port of EPSR (Empirical Potential Structure Refinement)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]  # a copy of the repository's LICENSE, for the distributions
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
keywords = [
    "EPSR",
    "neutron scattering",
    "x-ray scattering",
    "total scattering",
    "structure refinement",
    "disordered materials",
    "liquids",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry",
]

[project.urls]
Homepage = "https://github.com/IzzyRodger-edb/EPSRpy"
Documentation = "https://github.com/IzzyRodger-edb/EPSRpy/blob/main/python/docs/user_guide.md"
Source = "https://github.com/IzzyRodger-edb/EPSRpy"
Issues = "https://github.com/IzzyRodger-edb/EPSRpy/issues"

[project.scripts]
# Reports, 3D views and movies of a recorded refinement (needs the plot/viewer extras)
epsrvis = "epsr.vis.cli:main"

[project.optional-dependencies]
# matplotlib figures (epsr.plot) and the refinement analysis (epsr.vis)
plot = ["matplotlib>=3.7", "scipy>=1.10"]
# 3D configuration viewer and movies (epsr.vis.viewer)
viewer = ["pyvista>=0.43", "imageio>=2.30", "imageio-ffmpeg>=0.5"]
pandas = ["pandas>=2.0"]
progress = ["tqdm>=4.60"]
all = [
    "matplotlib>=3.7",
    "scipy>=1.10",
    "pyvista>=0.43",
    "imageio>=2.30",
    "imageio-ffmpeg>=0.5",
    "pandas>=2.0",
    "tqdm>=4.60",
]

[dependency-groups]
dev = [
    "maturin>=1.5,<2",
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
    "pytest-xdist>=3.8.0",
    "black>=26.10.1",
    "isort>=9.0.2",
]

[tool.maturin]
# Mixed Rust/Python project: the pure-Python package `epsr/` sits next to this file
# and the extension is installed as `epsr._core`.
module-name = "epsr._core"
bindings = "pyo3"
profile = "release"
# The source distribution carries the engine (../rust/epsr-core, copied in by
# maturin) but not the tests, the examples and their committed outputs.
exclude = [
    { path = "tests/**/*", format = "sdist" },
    { path = "examples/**/*", format = "sdist" },
    { path = "docs/**/*", format = "sdist" },
    { path = "uv.lock", format = "sdist" },
    { path = ".python-version", format = "sdist" },
]

[tool.uv]
# Rebuild the extension whenever the bindings or the Rust engine change.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "src/**/*.rs" },
    { file = "../rust/epsr-core/Cargo.toml" },
    { file = "../rust/epsr-core/src/**/*.rs" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running tests (case replays, refinements on experimental data)",
    "experimental: refinements of real neutron data from experimental_data/",
]
# --dist loadgroup keeps the tests of one experimental case on one worker under -n.
addopts = "-ra --dist loadgroup"

[tool.black]
line-length = 88
target-version = ["py310"]
extend-exclude = "target"

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["epsr"]
known_local_folder = ["epsr_cases", "epsr_workflow", "epsr_definitions", "conftest"]
skip_glob = ["target/*", ".venv/*"]

[tool.ruff]
# Linting only: formatting is done by black, import order by isort.
line-length = 88
target-version = "py310"
extend-exclude = ["target", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "UP", "B", "SIM", "NPY", "N"]
# black owns line length; it leaves long docstrings and comments alone.
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
files = ["epsr"]

[[tool.mypy.overrides]]
# The modules of epsr.vis shared with the standalone visualisation toolkit
# (visualisation/python_visualisation_toolkit) are only partly annotated and are not
# type-checked yet; epsr.vis.__init__ and epsr.vis.wrapper (wrapper glue) are.
module = [
    "epsr.vis.cli",
    "epsr.vis.live",
    "epsr.vis.metrics",
    "epsr.vis.outputs",
    "epsr.vis.plots",
    "epsr.vis.recorder",
    "epsr.vis.report",
    "epsr.vis.style",
    "epsr.vis.systems",
    "epsr.vis.trajectory",
    "epsr.vis.viewer",
]
ignore_errors = true
